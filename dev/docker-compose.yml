# Ambiente di sviluppo locale — replica del sito di produzione.
#
# Le versioni corrispondono a quelle del live (verificate nel backup):
#   WordPress 6.8.8 · PHP 8.2 · WooCommerce 10.7.0 · prefisso tabelle "wc"
#
# I file del sito arrivano dal backup GoDaddy; il tema e' montato dal repo,
# cosi' quello che modifichi in VS Code si vede subito su http://localhost:8090

services:
  db:
    image: mysql:8.0
    # Il dump di produzione contiene date zero ('0000-00-00 00:00:00'): il server
    # di GoDaddy le accetta, MySQL 8 con la sql_mode predefinita no, e l'import
    # si ferma con "Invalid default value". Qui si allenta la sql_mode quanto
    # basta a importare il dump cosi' com'e'.
    command: >
      --default-authentication-plugin=mysql_native_password
      --sql-mode=NO_ENGINE_SUBSTITUTION
      --explicit-defaults-for-timestamp=OFF
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      # il dump viene importato UNA SOLA VOLTA, alla prima creazione del volume
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Non basta un ping: durante l'inizializzazione MySQL avvia un server
      # temporaneo che risponde gia', e WordPress partirebbe mentre l'import
      # del dump e' ancora in corso. Si verifica invece che una tabella vera
      # sia arrivata.
      # Sentinella: l'ULTIMA tabella del dump. Con una qualsiasi (wcoptions,
      # per dire) il controllo passa a meta' import, perche' le tabelle
      # arrivano in ordine e WordPress ripartirebbe troppo presto.
      test: ["CMD-SHELL", "mysql -uroot -proot -e 'SELECT 1 FROM wordpress.wp_3zrr5ysaar_wpda_table_settings LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      retries: 60
      start_period: 120s

  wordpress:
    image: php:8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 8080 e' occupata da ApacheOSGeo4WWebServer (il web server di QGIS/OSGeo4W,
      # servizio Windows automatico). Usiamo la 8090.
      - "8090:80"
    volumes:
      - ./site:/var/www/html
      # il tema vero e' quello del repo: le modifiche si vedono subito
      - ../wp-content/themes/neuf-mois-theme:/var/www/html/wp-content/themes/neuf-mois-theme
    command: >
      bash -c "docker-php-ext-install mysqli pdo_mysql > /dev/null 2>&1;
               a2enmod rewrite > /dev/null 2>&1;
               apache2-foreground"

  # WP-CLI su richiesta: non parte con "up", si lancia esplicitamente.
  #   docker compose run --rm wpcli search-replace vecchio nuovo --all-tables
  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    volumes:
      - ./site:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress

volumes:
  db_data:
